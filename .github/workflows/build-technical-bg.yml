name: Build technical-service background

on:
  push:
    branches:
      - main
    paths:
      - 'assets/.technical-bg-parts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble HQ background and update page
        shell: bash
        run: |
          set -euo pipefail
          cat assets/.technical-bg-parts/part*.txt | base64 -d > assets/media/technical-service-content-bg-hq.webp

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("technical-service/index.html")
          source = path.read_text(encoding="utf-8")

          css = r'''<style id="technical-service-content-background-v2">
/* HQ continuous visual field below the technical-service hero. */
.post-hero-background{
  position:relative;
  isolation:isolate;
  background-color:#06080b;
  background-image:
    linear-gradient(180deg,rgba(5,7,10,.18),rgba(5,7,10,.28)),
    url("../assets/media/technical-service-content-bg-hq.webp");
  background-position:center top,center top;
  background-size:cover,cover;
  background-repeat:no-repeat,no-repeat;
}
.post-hero-background::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    linear-gradient(180deg,#05070a 0,rgba(5,7,10,.82) 70px,rgba(5,7,10,.30) 230px,rgba(5,7,10,0) 430px),
    linear-gradient(0deg,#040609 0,rgba(4,6,9,.80) 90px,rgba(4,6,9,.28) 260px,rgba(4,6,9,0) 470px);
}
.post-hero-background > .services-divider,
.post-hero-background > .section{
  position:relative;
  z-index:1;
}
.post-hero-background > .section{
  background:transparent!important;
}
@media(max-width:860px){
  .post-hero-background{
    background-position:center top,center top;
    background-size:cover,cover;
  }
  .post-hero-background::before{
    background:
      linear-gradient(180deg,#05070a 0,rgba(5,7,10,.82) 55px,rgba(5,7,10,.30) 180px,rgba(5,7,10,0) 330px),
      linear-gradient(0deg,#040609 0,rgba(4,6,9,.80) 70px,rgba(4,6,9,.24) 210px,rgba(4,6,9,0) 360px);
  }
}
</style>'''

          updated, count = re.subn(
              r'<style id="technical-service-content-background-v1">.*?</style>',
              css,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one v1 background style, found {count}")

          path.write_text(updated, encoding="utf-8")
          PY

          test -s assets/media/technical-service-content-bg-hq.webp
          bytes=$(wc -c < assets/media/technical-service-content-bg-hq.webp)
          test "$bytes" -gt 40000

      - name: Commit HQ asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/technical-service-content-bg-hq.webp technical-service/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace technical-service background with HQ asset"
          git push
