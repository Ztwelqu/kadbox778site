name: Rebuild technical hero asset
on:
  push:
    branches: [main]
    paths:
      - '.tmp-technical-hero/**'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild image when all chunks exist
        shell: bash
        run: |
          set -euo pipefail
          for n in 01 02 03 04 05 06 07 08; do
            test -f ".tmp-technical-hero/part${n}.txt" || { echo "Waiting for all chunks"; exit 0; }
          done
          mkdir -p assets/media
          cat .tmp-technical-hero/part*.txt | base64 -d > assets/media/technical-service-hero-v100-hq.avif
          bytes=$(wc -c < assets/media/technical-service-hero-v100-hq.avif)
          echo "Decoded bytes: ${bytes}"
          test "${bytes}" -ge 85000
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/media/technical-service-hero-v100-hq.avif')
          b=p.read_bytes()
          assert b[4:12] == b'ftypavif', b[:16]
          print('AVIF signature OK, bytes=', len(b))
          PY
          rm -rf .tmp-technical-hero
          rm -f .github/workflows/rebuild-technical-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add high-quality technical service hero asset"
          git push
