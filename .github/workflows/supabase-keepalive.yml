name: Supabase Keepalive
# Keeps the Supabase Free project active with real database reads.

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-keepalive.yml"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: "https://pcofdjdvqvrgdwkbraaj.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_1OCifM4X4p5CCDmwQ-W9Bw_o75NMixH"
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/supabase_keepalive?select=id&limit=1")"

          echo "Supabase keepalive response: ${response}"
          echo "${response}" | grep -q '"id":1'
